<!DOCTYPE html>
<html lang="tr">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="2416501028.css">
    <meta charset="UTF-8">
    <title>Etkinlik Ekle</title>
    <script type="module" src="js/event-form.js"></script>
</head>
<body>

    <header>
        <h1>Kampüs Etkinlikleri</h1>
        <nav>
            <a href="index.html">Ana Sayfa</a> | 
            <a href="etkinlikler.html">Etkinlikler</a> | 
            <a href="etkinlik-ekle.html">Etkinlik Ekle</a>
        </nav>
    </header>

    <main>
        <h1>Etkinlik Ekle</h1>

       <form id="etkinlik-formu" action="#" method="post">
            <p>
                <label for="ad">Etkinlik Adı:</label><br>
                <input type="text" id="ad" name="ad">
                <span id="ad-hata" class="hata-metni"></span>
            </p>

            <p>
                <label for="kategori">Kategori:</label><br>
                <select id="kategori" name="kategori">
                    <option value="">Seçiniz</option>
                    <option value="Seminer">Seminer</option>
                    <option value="Atölye">Atölye</option>
                    <option value="Söyleşi">Söyleşi</option>
                </select>
                <span id="kategori-hata" class="hata-metni"></span>
            </p>

            <p>
                <label for="tarih">Tarih:</label><br>
                <input type="text" id="tarih" name="tarih" placeholder="GG-AA-YYYY">
                <span id="tarih-hata" class="hata-metni"></span>
            </p>

            <p>
                <label for="saat">Saat:</label><br>
                <input type="text" id="saat" name="saat" placeholder="14:00">
                <span id="saat-hata" class="hata-metni"></span>
            </p>

            <p>
                <label for="yer">Yer / Konum:</label><br>
                <input type="text" id="yer" name="yer">
                <span id="yer-hata" class="hata-metni"></span>
            </p>

            <p>
                <label for="kontenjan">Kontenjan:</label><br>
                <input type="number" id="kontenjan" name="kontenjan">
                <span id="kontenjan-hata" class="hata-metni"></span>
            </p>

            <p>
                <label for="aciklama">Açıklama:</label><br>
                <textarea id="aciklama" name="aciklama" rows="4"></textarea>
                <span id="aciklama-hata" class="hata-metni"></span>
            </p>

            <button type="submit">Kaydet</button>
        </form>

        <div id="form-mesaj"></div>
    </main>

</body>
</html>
